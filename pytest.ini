[pytest]
# Limitar busca de testes apenas ao diretório atual
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Não subir para diretórios pais
norecursedirs = .git .venv dist build *.egg .eggs __pycache__ .pytest_cache .mypy_cache .ruff_cache htmlcov

# Evitar que o pytest suba para o diretório pai
addopts = --rootdir=.
